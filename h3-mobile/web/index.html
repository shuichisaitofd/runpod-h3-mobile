<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H3 Mobile</title>
<link rel="stylesheet" href="/h3-mobile/styles.css">
</head>
<body>
<div class="app">
<header class="header">
<div class="row"><div class="brand">H3 Mobile</div><div class="status" id="status">接続確認中</div></div>
<div class="project-tabs" id="tabs"><button class="pill active">案件A</button><button class="pill">案件B</button><button class="pill">案件C</button><button class="pill" id="add">＋追加</button></div>
</header>
<main>
<section class="page active" data-page="create">
<div id="connectNotice" class="notice">ComfyUIとの接続を確認しています。</div>
<div class="card"><h2>生成モード</h2><div class="mode"><button class="active" data-mode="i2v">画像から動画</button><button data-mode="ref">参照から動画</button></div></div>
<div class="card"><h2>入力</h2><label>タイトル</label><input id="title" value="案件A - テスト01">
<div id="i2v"><label>元画像</label><div class="filebox"><input id="image0" type="file" accept="image/*"></div></div>
<div id="ref" class="hidden"><label>参照画像1</label><div class="filebox"><input id="ref0" type="file" accept="image/*"></div><label>参照画像2</label><div class="filebox"><input id="ref1" type="file" accept="image/*"></div></div>
<label>プロンプト</label><textarea id="prompt">人物の構図を維持しながら自然に動く。</textarea></div>
<div class="card"><h2>生成設定</h2><div class="grid2"><div><label>秒数</label><input id="sec" type="number" value="10" min="1" step="1" inputmode="numeric"></div><div><label>Steps</label><input id="steps" type="number" value="16" min="1" max="50"></div></div>
<label>画面比率</label><select id="ratio"><option selected>元画像と同じ</option><option>2:3</option><option>3:2</option><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option><option>3:4</option></select>
<div id="refextra" class="hidden"><label>ref_image_size</label><select id="refSize"><option>match</option><option selected>max</option></select></div>
<details><summary>詳細設定を開く</summary><div class="stacked"><div><label>Sampler</label><select id="sampler"><option selected>res_multistep</option></select></div><div><label>Scheduler</label><select id="scheduler"><option selected>simple</option></select></div><div><label>Seed</label><input id="seed" type="number" value="-1"></div></div></details></div>
<div class="card"><div class="actions"><button class="secondary" id="dup">複製</button><button class="primary" id="gen">生成キューに追加</button></div><div class="small" style="margin-top:10px">Ref2VAのAPI workflow登録後に実生成が有効になります。</div></div>
</section>
<section class="page" data-page="running"><div class="card"><h2>実行中</h2><div id="queue"></div></div></section>
<section class="page" data-page="history"><div class="card"><div class="row"><h2 style="margin:0;flex:1">履歴</h2><button class="secondary" id="refreshHistory">更新</button></div><div id="historyList"></div></div></section>
<section class="page" data-page="settings">
<div class="card"><h2>モデル管理</h2><div class="small">スマホ使用時だけ、必要なセットをRunPodへ直接ダウンロードします。</div>
<div class="model-actions"><button class="primary" id="prepareRef">Ref2VAを準備</button><button class="primary" id="prepareI2V">I2Vを準備</button></div>
<div id="modelMessage" class="notice hidden"></div><div id="modelList" class="model-list"><div class="small">モデル状態を確認中...</div></div></div>
<div class="card"><h2>接続</h2><div class="small">このページはComfyUIと同じ8188上で動作します。</div><label>API workflow</label><div id="workflowStatus" class="notice">確認中</div></div>
</section>
</main>
</div>
<nav class="bottom"><div class="bottomin"><button class="nav active" data-target="create">作成</button><button class="nav" data-target="running">実行中</button><button class="nav" data-target="history">履歴</button><button class="nav" data-target="settings">設定</button></div></nav>
<script src="/h3-mobile/app.js"></script>
</body></html>
