<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件切り替えテスト</title>
<style>
:root{--bg:#0b0f15;--card:#171a21;--line:#2b3240;--text:#e8edf5;--muted:#98a2b3;--acc:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.app{max-width:430px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:16px;margin:0 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.current{flex:1;min-width:0}
.name{font-size:18px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11px;color:var(--muted);margin-top:3px}
button,input{font-family:inherit}
.btn{border:1px solid var(--line);background:#151922;color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer}
.btn.primary{background:#1b365d;border-color:#7aa2ff}
.btn.danger{color:#ffc0c0;border-color:#683333}
.search{width:100%;background:#11151c;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);margin:8px 0}
.list{display:grid;gap:6px;max-height:52vh;overflow:auto}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#11151c}
.item.on{border-color:#7aa2ff;background:#1b365d}
.item button.pick{flex:1;text-align:left;background:none;border:0;color:inherit;padding:0;cursor:pointer}
.item .t{font-weight:700}
.item .s{font-size:11px;color:var(--muted);margin-top:2px}
.empty{font-size:12px;color:var(--muted);padding:8px}
.fake{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <h1>案件切り替えテスト</h1>
  <p class="hint">本番の作成画面は触っていません。このページだけで確認できます。今の案件だけ大きく出し、一覧は検索して選びます。</p>
  <div class="card">
    <div class="row">
      <div class="current">
        <div class="name" id="currentName">—</div>
        <div class="meta" id="currentMeta"></div>
      </div>
      <button class="btn" id="renameBtn">改名</button>
      <button class="btn" id="addBtn">追加</button>
      <button class="btn danger" id="delBtn">削除</button>
    </div>
  </div>
  <div class="card">
    <div class="row"><b style="flex:1">案件一覧</b><span class="meta" id="count"></span></div>
    <input class="search" id="search" placeholder="名前で検索">
    <div class="list" id="list"></div>
  </div>
  <div class="card">
    <div class="fake">この枠はダミーです。実際のプロンプト欄の代わり。</div>
    <div id="dummy" style="margin-top:8px;font-size:13px;line-height:1.6"></div>
  </div>
</div>
<script>
const KEY="h3-project-switcher-test";
const seed=["騎乗位 A","正常位 室内","フェラ POV","手マン ズボン","立位 壁","参照04 安定","I2V 10秒","胸部寄り","ディルド固定","テスト用 長い案件名をここに入れる"];
function uid(){return String(Date.now())+Math.random().toString(16).slice(2);}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    if(raw&&Array.isArray(raw.items)&&raw.items.length) return raw;
  }catch(e){}
  const items=seed.map((name,i)=>({id:uid()+i,name,note:"ダミー"}));
  return {items, active:items[0].id};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
let state=load();
const $=id=>document.getElementById(id);
function active(){return state.items.find(p=>p.id===state.active)||state.items[0];}
function render(){
  const cur=active();
  if(cur) state.active=cur.id;
  $("currentName").textContent=cur?cur.name:"なし";
  $("currentMeta").textContent=cur?state.items.length+"件中の現在案件":"";
  $("count").textContent=state.items.length+"件";
  const q=($("search").value||"").trim().toLowerCase();
  const rows=state.items.filter(p=>!q||p.name.toLowerCase().includes(q));
  $("list").innerHTML=rows.length?rows.map(p=>`
    <div class="item ${p.id===state.active?"on":""}">
      <button class="pick" data-id="${p.id}">
        <div class="t">${p.name}</div>
        <div class="s">${p.id===state.active?"選択中":"切替"}</div>
      </button>
    </div>`).join(""):'<div class="empty">一致する案件がありません</div>';
  $("dummy").textContent=cur?`「${cur.name}」の入力内容がここに入ります。案件を切り替えると、この中身だけ変わります。`:"案件がありません";
}
$("list").onclick=e=>{
  const b=e.target.closest("[data-id]");
  if(!b) return;
  state.active=b.dataset.id;
  save(); render();
};
$("search").oninput=render;
$("addBtn").onclick=()=>{
  const name=prompt("案件名","案件 "+(state.items.length+1));
  if(!name) return;
  const rec={id:uid(),name:name.trim(),note:"新規"};
  state.items.push(rec);
  state.active=rec.id;
  save(); render();
};
$("renameBtn").onclick=()=>{
  const cur=active(); if(!cur) return;
  const name=prompt("新しい名前",cur.name);
  if(!name) return;
  cur.name=name.trim();
  save(); render();
};
$("delBtn").onclick=()=>{
  if(state.items.length<=1){alert("最後の1件は削除できません");return;}
  const cur=active();
  if(!confirm("「"+cur.name+"」を削除しますか？")) return;
  state.items=state.items.filter(p=>p.id!==cur.id);
  state.active=state.items[0].id;
  save(); render();
};
render();
</script>
</body>
</html>
