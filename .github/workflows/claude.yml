name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor != 'claude[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 240
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm install),Bash(npm run build),Bash(npm run dev:*),Bash(npm run preview:*),Bash(npm exec:*),Bash(npx:*),Bash(npm run test:*),Bash(npm test),Bash(npm run lint:*),Bash(python3:*),Bash(python:*),Bash(node:*),Bash(pip:*),Bash(pip3:*),Bash(sha256sum:*),Bash(file:*),Bash(find:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(curl:*),Bash(wget:*),Bash(chromium:*),Bash(timeout:*),Bash(nohup:*),Bash(kill:*),Bash(pkill:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*),Bash(convert:*),Bash(magick:*),Bash(identify:*)"
