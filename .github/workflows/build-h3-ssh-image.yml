name: Build H3 Full SSH Test Image

on:
  workflow_dispatch:
  push:
    branches: [codex/h3-full-ssh]
    paths:
      - Dockerfile.ssh
      - run-ssh.sh
      - .github/workflows/build-h3-ssh-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SSH test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ssh
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runpod-h3-mobile:h3-cu130-ssh-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
