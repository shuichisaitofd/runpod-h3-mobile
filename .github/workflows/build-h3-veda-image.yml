name: Build H3 Veda Test Image

on:
  workflow_dispatch:
  push:
    branches: [h3-veda-image]
    paths:
      - Dockerfile.veda
      - veda-image/**
      - .github/workflows/build-h3-veda-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n veda-image/veda-boot-setup.sh
          bash -n veda-image/run-h3-veda.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.veda
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shuichisaitofd/runpod-h3-mobile:h3-veda-test
